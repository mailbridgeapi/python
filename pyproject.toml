[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailbridgeapi"
version = "1.0.0"
description = "Official Python client for the MailBridgeAPI email API."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "MailBridgeAPI"}]
keywords = ["email", "api", "smtp", "imap", "mailbridgeapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.urls]
Homepage = "https://mailbridgeapi.com/"
Documentation = "https://github.com/mailbridgeapi/mailbridgeapi"
Issues = "https://github.com/mailbridgeapi/python/issues"

[tool.setuptools.packages.find]
where = ["src"]

